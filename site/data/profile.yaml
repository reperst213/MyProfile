name: "Joeunbo"
title: "컴퓨터인공지능학부 수강생"
summary: >
  안녕하세요. 저는 컴퓨터인공지능학부에서 공부하고 있는 ~~Joeunbo~~입니다. 인공지능과 컴퓨터 기술에 관심이 있으며, 다양한 기술을 배우고 직접 만들어 보며 이해를 넓혀가고 있습니다.
  현재는 인공지능, 에이전트 워크플로우, 컴퓨터비전에 집중하고 있습니다.
  여러 작업을 연결해 하나의 목표를 수행하는 과정에 흥미가 있어 에이전트 워크플로우에 관심을 갖게 되었습니다.
  앞으로 간단한 워크플로우를 직접 만들어 보며 각 단계가 어떻게 연결되고 동작하는지 배우고 싶습니다.
