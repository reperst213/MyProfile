<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Computer Graphics HW 01</title>
    <style>
        .controls-guide {
            max-width: 960px;
            padding: 16px 20px;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            color: #222;
        }
        .controls-guide h1 { font-size: 1.25rem; margin: 0 0 4px; }
        .controls-guide p { margin: 0 0 12px; }
        .controls-guide ul {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .controls-guide kbd {
            display: inline-block;
            min-width: 1.5em;
            padding: 1px 4px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #f4f4f4;
            font: inherit;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>

<body>
    <section class="controls-guide" aria-labelledby="controls-title">
        <h1 id="controls-title">로봇팔 조작 방법</h1>
        <p>영문 소문자 입력 상태에서 키보드를 사용해 주세요.</p>
        <ul>
            <li><kbd>Q</kbd> / <kbd>A</kbd> 어깨 각도 늘리기 / 줄이기</li>
            <li><kbd>W</kbd> / <kbd>S</kbd> 팔꿈치 각도 늘리기 / 줄이기</li>
            <li><kbd>E</kbd> / <kbd>D</kbd> 손목 각도 늘리기 / 줄이기</li>
            <li><kbd>T</kbd> 손목 회전</li>
            <li><kbd>G</kbd> 팔 크기 늘리기</li>
            <li><kbd>R</kbd> 초기 상태로 되돌리기</li>
        </ul>
    </section>
    <canvas id="glCanvas" width="1000" height="1000"></canvas>

    <script src="./lib/gl-matrix-min.js"></script>
    <script src="./robot-arm.js"></script>
</body>
</html>
