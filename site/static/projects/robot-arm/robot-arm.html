<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Computer Graphics HW 01</title>
    <style>
        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .controls-guide {
            position: fixed;
            top: 70px;
            left: 20px;
            z-index: 1;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            color: white;
            text-shadow: 0 1px 3px black;
            pointer-events: none;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            padding: 10px 14px;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-family: system-ui, sans-serif;
            text-decoration: none;
        }
        .back-link:focus-visible {
            outline: 3px solid #5689ff;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <a class="back-link" href="../../writing/robot-arm/">← 프로젝트 소개로</a>
    <div class="controls-guide" aria-label="키보드 조작 키">
        <div>W/S: 팔꿈치 접기 / 펴기</div>
        <div>E/D: 손목 접기 / 펴기</div>
        <div>G: 팔 크기 늘리기</div>
        <div>T: 손목 회전</div>
        <div>R: 초기화</div>
    </div>
    <canvas id="glCanvas" width="1000" height="1000"></canvas>

    <script src="./lib/gl-matrix-min.js"></script>
    <script src="./robot-arm.js"></script>
</body>
</html>
